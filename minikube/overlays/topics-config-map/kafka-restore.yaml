apiVersion: kafka.oso.sh/v1alpha1
kind: KafkaRestore
metadata:
  name: restore-topics-config-map
  namespace: confluent
spec:
  backupRef:
    name: backup-test-topic
  kafkaCluster:
    bootstrapServers:
      - kafka.confluent.svc.cluster.local:9071
    securityProtocol: PLAINTEXT
  topicsConfigMap:
    name: topics-config-map-test
    topicsKey: restore_topics
    topicMappingsKey: topic_mappings
  createTopics: true
  produceAcks: -1
